<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>NEON RUNNER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05010f;
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100%;height:100%;touch-action:none}

  #ui{position:fixed;inset:0;pointer-events:none;padding:14px;
      display:flex;flex-direction:column;justify-content:space-between;
      text-shadow:0 0 10px currentColor,0 0 30px currentColor}

  #top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #scoreBox{color:#00e5ff;font-size:clamp(22px,5vw,40px);font-weight:700;letter-spacing:2px;line-height:1}
  #scoreBox small{display:block;font-size:9px;letter-spacing:3px;opacity:.55;margin-top:4px}
  #coinBox{color:#ffd21e;font-size:clamp(16px,3.6vw,26px);font-weight:700;text-align:right;line-height:1}
  #coinBox small{display:block;font-size:9px;letter-spacing:3px;opacity:.55;margin-top:4px}
  #boardTag{color:#00ffc8;font-size:11px;letter-spacing:2px;margin-top:8px;text-align:right;
    opacity:0;transition:opacity .2s}
  #boardTag.on{opacity:1;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  #bottom{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .buff{font-size:11px;letter-spacing:2px;padding:6px 10px;border-radius:6px;
    border:1px solid currentColor;background:rgba(255,255,255,.04);
    opacity:0;transform:translateY(8px);transition:.18s}
  .buff.on{opacity:1;transform:none}
  #bMagnet{color:#ff2fb0}
  #bX2{color:#ffd21e}

  #flash{position:fixed;inset:0;pointer-events:none;background:#00ffc8;opacity:0;
    mix-blend-mode:screen;transition:opacity .35s}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
    background:radial-gradient(ellipse at center,rgba(20,0,45,.75),rgba(5,1,15,.96));
    backdrop-filter:blur(3px);transition:opacity .3s;z-index:10}
  .overlay.hide{opacity:0;pointer-events:none}

  h1{font-size:clamp(30px,9vw,64px);letter-spacing:6px;font-weight:800;
     color:#00e5ff;text-shadow:0 0 12px #00e5ff,0 0 46px #0088ff;line-height:.95}
  h1 span{display:block;color:#ff2fb0;text-shadow:0 0 12px #ff2fb0,0 0 46px #a0006e}
  .sub{font-size:11px;letter-spacing:4px;color:#7a5cff;opacity:.8}
  .keys{font-size:12px;line-height:2;color:#b9a8ff;letter-spacing:1px;opacity:.85}
  .keys b{color:#00e5ff}
  .big{font-size:clamp(28px,7vw,48px);color:#ffd21e;font-weight:800;
       text-shadow:0 0 14px #ffd21e,0 0 40px #a06a00}

  button{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:700;
    letter-spacing:4px;font-size:15px;padding:14px 44px;border-radius:40px;
    color:#05010f;background:linear-gradient(90deg,#00e5ff,#7a5cff);
    border:none;box-shadow:0 0 22px rgba(0,229,255,.55),0 0 60px rgba(122,92,255,.35);
    transition:transform .12s,box-shadow .2s}
  button:active{transform:scale(.96)}
  button:hover{box-shadow:0 0 30px rgba(0,229,255,.9),0 0 90px rgba(122,92,255,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="ui">
  <div id="top">
    <div id="scoreBox"><span id="score">0</span><small>ОЧКИ</small></div>
    <div>
      <div id="coinBox"><span id="coins">0</span><small>МОНЕТЫ</small></div>
      <div id="boardTag">[B] ДОСКА ГОТОВА</div>
    </div>
  </div>
  <div id="bottom">
    <div class="buff" id="bMagnet">🧲 МАГНИТ <span id="tMagnet"></span></div>
    <div class="buff" id="bX2">×2 ОЧКИ <span id="tX2"></span></div>
  </div>
</div>

<div class="overlay" id="menu">
  <h1>NEON<span>RUNNER</span></h1>
  <div class="sub">БЕСКОНЕЧНЫЙ ЗАБЕГ</div>
  <div class="keys">
    <div><b>← →</b> / <b>A D</b> — сменить полосу</div>
    <div><b>↑</b> / <b>W</b> / <b>ПРОБЕЛ</b> — прыжок</div>
    <div><b>↓</b> / <b>S</b> — перекат (в воздухе — быстрое падение)</div>
    <div><b>B</b> — доска (нужно 100 монет)</div>
  </div>
  <button id="btnStart">ИГРАТЬ</button>
</div>

<div class="overlay hide" id="over">
  <div class="sub">ЗАБЕГ ОКОНЧЕН</div>
  <div class="big" id="goScore">0</div>
  <div class="sub" id="goCoins">0 МОНЕТ</div>
  <button id="btnRestart">ЕЩЁ РАЗ</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   КОНСТАНТЫ
   ═══════════════════════════════════════════════════════════════ */
const LANE_X      = [-2, 0, 2];
const SPAWN_Z     = -140;
const DESPAWN_Z   = 16;

const STAND_H     = 1.6;
const ROLL_H      = 0.62;
const ROLL_TIME   = 0.55;
const GRAVITY     = -62;
const JUMP_V      = 15.5;

const BASE_SPEED  = 26;
const MAX_SPEED   = 56;

const SCORE_PER_SEC = 20;
const COIN_SCORE    = 10;
const BOARD_COST    = 100;

const COIN_MAX      = 260;
const OB_PER_TYPE   = 26;
const PU_MAX        = 8;

const MAGNET_TIME   = 8;
const X2_TIME       = 10;

const rnd      = Math.random;
const randInt  = n => (rnd() * n) | 0;
const clamp    = (v, a, b) => v < a ? a : v > b ? b : v;

/* ═══════════════════════════════════════════════════════════════
   RENDERER / SCENE
   ═══════════════════════════════════════════════════════════════ */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance',
  stencil: false, alpha: false
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05010f, 1);

const scene  = new THREE.Scene();
scene.fog    = new THREE.Fog(0x05010f, 40, 150);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 4.3, 9.5);
camera.lookAt(0, 1.3, -11);

/* ═══════════════════════════════════════════════════════════════
   ЗЕМЛЯ (1 draw call, неоновая сетка в шейдере)
   ═══════════════════════════════════════════════════════════════ */
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uScroll:   { value: 0 },
    uFogColor: { value: new THREE.Color(0x05010f) },
    uFogNear:  { value: 40 },
    uFogFar:   { value: 150 }
  },
  vertexShader: /* glsl */`
    varying vec3 vW;
    varying float vD;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      vec4 mv = viewMatrix * wp;
      vD = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uScroll;
    uniform vec3  uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;
    varying vec3  vW;
    varying float vD;

    void main(){
      vec2 p = vec2(vW.x, vW.z - uScroll);
      vec2 cs = p * 0.5;
      vec2 f  = abs(fract(cs) - 0.5);
      float db = 0.5 - min(f.x, f.y);

      float w = 0.022 + vD * 0.0011;
      float grid = 1.0 - smoothstep(0.0, w, db);

      float ax = abs(vW.x);
      float dl = min(abs(ax - 1.0), abs(ax - 3.0));
      float lane = 1.0 - smoothstep(0.0, 0.055 + vD * 0.0008, dl);

      vec3 col = vec3(0.42, 0.10, 1.00) * grid * 0.55;
      col += vec3(0.00, 0.85, 1.00) * lane * 1.15;
      col += vec3(0.10, 0.00, 0.25) * (1.0 - smoothstep(0.0, 12.0, abs(vW.x))) * 0.35;

      float fog = smoothstep(uFogNear, uFogFar, vD);
      col = mix(col, uFogColor, fog);
      gl_FragColor = vec4(col, 1.0);
    }`
});

const ground = new THREE.Mesh(new THREE.PlaneGeometry(110, 420), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, -170);
scene.add(ground);

/* ═══════════════════════════════════════════════════════════════
   ИГРОК
   ═══════════════════════════════════════════════════════════════ */
const playerGroup = new THREE.Group();
{
  const boxGeo  = new THREE.BoxGeometry(0.8, 1, 0.8);
  const body    = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
  const edges   = new THREE.LineSegments(
    new THREE.EdgesGeometry(boxGeo),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  );
  playerGroup.add(body, edges);
}
scene.add(playerGroup);

// «доска» (щит)
const boardMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.05, 0.13, 1.75),
  new THREE.MeshBasicMaterial({ color: 0x00ffc8 })
);
boardMesh.visible = false;
scene.add(boardMesh);

/* ═══════════════════════════════════════════════════════════════
   МОНЕТЫ (InstancedMesh)
   ═══════════════════════════════════════════════════════════════ */
const coinGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.09, 8);
coinGeo.rotateX(Math.PI / 2);

const coinMesh = new THREE.InstancedMesh(
  coinGeo,
  new THREE.MeshBasicMaterial({ color: 0xffd21e }),
  COIN_MAX
);
coinMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
coinMesh.frustumCulled = false;
coinMesh.count = 0;
scene.add(coinMesh);

const coinsArr = new Array(COIN_MAX);
for (let i = 0; i < COIN_MAX; i++)
  coinsArr[i] = { active: false, x: 0, y: 0, z: 0, rot: 0 };

/* ═══════════════════════════════════════════════════════════════
   ПРЕПЯТСТВИЯ (3 InstancedMesh)
   тип 0 — перекат (сверху), тип 1 — прыжок (снизу), тип 2 — обход
   ═══════════════════════════════════════════════════════════════ */
const OB_DEF = [
  { w: 1.9, h: 1.5,  d: 0.6, cy: 1.90,  yMin: 1.15, yMax: 99 },  // ROLL
  { w: 1.9, h: 0.85, d: 0.6, cy: 0.425, yMin: -1,   yMax: 0.85 },// JUMP
  { w: 1.9, h: 3.0,  d: 0.6, cy: 1.50,  yMin: -1,   yMax: 99 }   // DODGE
];

const OB_COLORS = [0xb026ff, 0x00e5ff, 0xff2255];
const obGeo = new THREE.BoxGeometry(1, 1, 1);

const obMeshes = [];
const obPools  = [];

for (let t = 0; t < 3; t++) {
  const m = new THREE.InstancedMesh(
    obGeo,
    new THREE.MeshBasicMaterial({ color: OB_COLORS[t] }),
    OB_PER_TYPE
  );
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  m.count = 0;
  scene.add(m);
  obMeshes.push(m);

  const pool = new Array(OB_PER_TYPE);
  for (let i = 0; i < OB_PER_TYPE; i++)
    pool[i] = { active: false, x: 0, z: 0, lane: 0 };
  obPools.push(pool);
}

/* ═══════════════════════════════════════════════════════════════
   БОНУСЫ (InstancedMesh + instanceColor)
   ═══════════════════════════════════════════════════════════════ */
const puMesh = new THREE.InstancedMesh(
  new THREE.OctahedronGeometry(0.45, 0),
  new THREE.MeshBasicMaterial({ color: 0xffffff }),
  PU_MAX
);
puMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
puMesh.frustumCulled = false;
puMesh.count = 0;

const _white = new THREE.Color(0xffffff);
for (let i = 0; i < PU_MAX; i++) puMesh.setColorAt(i, _white);
scene.add(puMesh);

const PU_COLORS = [new THREE.Color(0xff2fb0), new THREE.Color(0xffd21e)];
const puArr = new Array(PU_MAX);
for (let i = 0; i < PU_MAX; i++)
  puArr[i] = { active: false, x: 0, y: 0, z: 0, rot: 0, kind: 0, color: new THREE.Color() };

/* ═══════════════════════════════════════════════════════════════
   СОСТОЯНИЕ ИГРЫ
   ═══════════════════════════════════════════════════════════════ */
let gameState = 'menu';

const player = {
  lane: 1, x: 0, y: 0, vy: 0,
  h: STAND_H, onGround: true,
  rolling: false, rollTimer: 0
};

let score = 0, coins = 0, distance = 0, speed = BASE_SPEED;
let magnetTimer = 0, x2Timer = 0, boardActive = false;
let spawnAccum = 0, nextGap = 0;
let boardFlash = 0;

/* ═══════════════════════════════════════════════════════════════
   ПУЛЫ / СПАВН
   ═══════════════════════════════════════════════════════════════ */
function isObstructed(x, z) {
  for (let t = 0; t < 3; t++) {
    const p = obPools[t];
    for (let i = 0; i < OB_PER_TYPE; i++) {
      const o = p[i];
      if (o.active && Math.abs(o.z - z) < 1.6 && Math.abs(o.x - x) < 1.6) return true;
    }
  }
  return false;
}

function spawnCoin(x, y, z) {
  if (isObstructed(x, z)) return;
  for (let i = 0; i < COIN_MAX; i++) {
    const c = coinsArr[i];
    if (!c.active) {
      c.active = true;
      c.x = x; c.y = y; c.z = z;
      c.rot = rnd() * 6.2832;
      return;
    }
  }
}

function spawnObstacle(type, lane, z) {
  const pool = obPools[type];
  for (let i = 0; i < OB_PER_TYPE; i++) {
    const o = pool[i];
    if (!o.active) {
      o.active = true;
      o.x = LANE_X[lane];
      o.z = z;
      o.lane = lane;
      return;
    }
  }
}

function spawnPowerup(kind, lane, z) {
  for (let i = 0; i < PU_MAX; i++) {
    const u = puArr[i];
    if (!u.active) {
      u.active = true;
      u.kind = kind;
      u.x = LANE_X[lane];
      u.y = 1.1;
      u.z = z;
      u.rot = rnd() * 6.2832;
      u.color.copy(PU_COLORS[kind]);
      return;
    }
  }
}

/* ── паттерны ─────────────────────────────────────────────────── */
function spawnPattern(z) {
  const r = rnd();
  let len = 0;

  if (r < 0.62) {
    /* одиночное препятствие + дорожка монет ПОСЛЕ него */
    const lane = randInt(3);
    const tr = rnd();
    const type = tr < 0.34 ? 0 : (tr < 0.67 ? 1 : 2);

    spawnObstacle(type, lane, z);

    let coinLane = lane;
    if (type === 2) { do { coinLane = randInt(3); } while (coinLane === lane); }

    const n = 4 + randInt(4);          // 4–7 монет (было 6–10)
    const startZ = z - 11;             // короче «хвост» (было 13)
    for (let i = 0; i < n; i++) spawnCoin(LANE_X[coinLane], 0.9, startZ - i * 2.4);
    len = 11 + (n - 1) * 2.4;

  } else if (r < 0.87) {
    /* одинаковое препятствие на ВСЕХ трёх полосах + полоса монет */
    const type = rnd() < 0.5 ? 0 : 1;
    for (let l = 0; l < 3; l++) spawnObstacle(type, l, z);

    const n = 3 + randInt(3);          // 3–5 монет на дорожку (было 5–8)
    const startZ = z - 14;             // (было 17)
    for (let l = 0; l < 3; l++)
      for (let i = 0; i < n; i++)
        spawnCoin(LANE_X[l], 0.9, startZ - i * 2.4);
    len = 14 + (n - 1) * 2.4;

  } else {
    /* волна монет */
    const n = 7 + randInt(6);          // 7–12 (было 10–17)
    for (let i = 0; i < n; i++) {
      const lane = clamp(Math.round(1 + Math.sin(i * 0.55) * 1.1), 0, 2);
      spawnCoin(LANE_X[lane], 0.9, z - i * 2.4);
    }
    len = (n - 1) * 2.4;
  }

  if (rnd() < 0.15) {
    spawnPowerup(rnd() < 0.5 ? 0 : 1, randInt(3), z - len - 6);
    len += 6;
  }
  return len;
}

/* ═══════════════════════════════════════════════════════════════
   УПРАВЛЕНИЕ
   ═══════════════════════════════════════════════════════════════ */
function tryLane(dir) {
  if (gameState !== 'play') return;
  const nl = player.lane + dir;
  if (nl >= 0 && nl <= 2) player.lane = nl;
}

function tryJump() {
  if (gameState !== 'play') return;
  if (player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
    player.rolling = false;
    player.rollTimer = 0;
  }
}

function tryRoll() {
  if (gameState !== 'play') return;
  if (!player.onGround) player.vy = Math.min(player.vy, -46);   // быстрое падение
  player.rolling = true;
  player.rollTimer = ROLL_TIME;
}

function tryBoard() {
  if (gameState !== 'play' || boardActive) return;
  if (coins >= BOARD_COST) {
    coins -= BOARD_COST;
    boardActive = true;
  }
}

addEventListener('keydown', e => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA':  tryLane(-1); e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': tryLane(1);  e.preventDefault(); break;
    case 'ArrowUp': case 'KeyW': case 'Space': tryJump(); e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': tryRoll(); e.preventDefault(); break;
    case 'KeyB': tryBoard(); break;
    case 'Enter': if (gameState !== 'play') startGame(); break;
  }
});

/* тач */
let tsX = 0, tsY = 0;
canvas.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  tsX = t.clientX; tsY = t.clientY;
}, { passive: true });

canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tsX, dy = t.clientY - tsY;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < 26) { tryJump(); return; }
  if (adx > ady) tryLane(dx > 0 ? 1 : -1);
  else if (dy > 0) tryRoll();
  else tryJump();
}, { passive: true });

/* ═══════════════════════════════════════════════════════════════
   HUD
   ═══════════════════════════════════════════════════════════════ */
const elScore   = document.getElementById('score');
const elCoins   = document.getElementById('coins');
const elBoard   = document.getElementById('boardTag');
const elMagnet  = document.getElementById('bMagnet');
const elX2      = document.getElementById('bX2');
const elTMagnet = document.getElementById('tMagnet');
const elTX2     = document.getElementById('tX2');
const elFlash   = document.getElementById('flash');
const elMenu    = document.getElementById('menu');
const elOver    = document.getElementById('over');
const elGoScore = document.getElementById('goScore');
const elGoCoins = document.getElementById('goCoins');

let hudTimer = 0;

function updateHUD(dt) {
  hudTimer += dt;
  if (hudTimer < 0.07) return;
  hudTimer = 0;

  elScore.textContent = Math.floor(score);
  elCoins.textContent = coins;

  const canBoard = coins >= BOARD_COST && !boardActive;
  elBoard.classList.toggle('on', canBoard);

  if (magnetTimer > 0) {
    elMagnet.classList.add('on');
    elTMagnet.textContent = magnetTimer.toFixed(1) + 'с';
  } else elMagnet.classList.remove('on');

  if (x2Timer > 0) {
    elX2.classList.add('on');
    elTX2.textContent = x2Timer.toFixed(1) + 'с';
  } else elX2.classList.remove('on');
}

/* ═══════════════════════════════════════════════════════════════
   СТАРТ / РЕСТАРТ / КОНЕЦ
   ═══════════════════════════════════════════════════════════════ */
function resetGame() {
  for (let i = 0; i < COIN_MAX; i++) coinsArr[i].active = false;
  for (let t = 0; t < 3; t++)
    for (let i = 0; i < OB_PER_TYPE; i++) obPools[t][i].active = false;
  for (let i = 0; i < PU_MAX; i++) puArr[i].active = false;

  player.lane = 1; player.x = 0; player.y = 0; player.vy = 0;
  player.h = STAND_H; player.onGround = true;
  player.rolling = false; player.rollTimer = 0;

  score = 0; coins = 0; distance = 0; speed = BASE_SPEED;
  magnetTimer = 0; x2Timer = 0; boardActive = false;
  spawnAccum = 0; nextGap = 0; boardFlash = 0;

  groundMat.uniforms.uScroll.value = 0;

  elOver.classList.add('hide');
  elMenu.classList.add('hide');
  boardMesh.visible = false;
}

function startGame() {
  resetGame();
  gameState = 'play';
  lastTime = performance.now();
}

function gameOver() {
  gameState = 'over';
  elGoScore.textContent = Math.floor(score).toLocaleString('ru-RU');
  elGoCoins.textContent = coins + ' МОНЕТ';
  elOver.classList.remove('hide');
  elBoard.classList.remove('on');
  elMagnet.classList.remove('on');
  elX2.classList.remove('on');
}

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRestart').addEventListener('click', startGame);

/* ═══════════════════════════════════════════════════════════════
   ЛОГИКА
   ═══════════════════════════════════════════════════════════════ */
function onHit() {
  if (boardActive) {
    boardActive = false;
    boardMesh.visible = false;
    boardFlash = 1;
    elFlash.style.transition = 'none';
    elFlash.style.opacity = '0.55';
    requestAnimationFrame(() => {
      elFlash.style.transition = 'opacity .45s';
      elFlash.style.opacity = '0';
    });
    for (let t = 0; t < 3; t++) {
      const p = obPools[t];
      for (let i = 0; i < OB_PER_TYPE; i++)
        if (p[i].active && Math.abs(p[i].z) < 2.2) p[i].active = false;
    }
    return;
  }
  gameOver();
}

function update(dt) {
  /* ── скорость / дистанция ── */
  speed = Math.min(BASE_SPEED + distance * 0.0125, MAX_SPEED);
  const move = speed * dt;
  distance += move;
  groundMat.uniforms.uScroll.value += move;

  /* ── очки за время ── */
  score += SCORE_PER_SEC * dt * (x2Timer > 0 ? 2 : 1);

  /* ── таймеры бонусов ── */
  if (magnetTimer > 0) magnetTimer -= dt;
  if (x2Timer > 0)     x2Timer -= dt;

  /* ═══ ИГРОК ═══ */
  const targetX = LANE_X[player.lane];
  player.x += (targetX - player.x) * (1 - Math.exp(-17 * dt));

  if (!player.onGround) {
    player.vy += GRAVITY * dt;
    player.y  += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; player.onGround = true; }
  }

  if (player.rolling) {
    player.rollTimer -= dt;
    if (player.rollTimer <= 0) player.rolling = false;
  }
  player.h = player.rolling ? ROLL_H : STAND_H;

  const pTop    = player.y + player.h;
  const pBottom = player.y;
  const pCenterY = player.y + player.h * 0.5;

  /* ═══ ПРЕПЯТСТВИЯ ═══ */
  for (let t = 0; t < 3; t++) {
    const def  = OB_DEF[t];
    const pool = obPools[t];

    for (let i = 0; i < OB_PER_TYPE; i++) {
      const o = pool[i];
      if (!o.active) continue;

      o.z += move;
      if (o.z > DESPAWN_Z) { o.active = false; continue; }

      /* коллизия: z-окно 2.0 > макс. шага (56/30 = 1.87) — туннелирование исключено */
      if (o.z < -1.0 || o.z > 1.0) continue;
      if (Math.abs(o.x - player.x) > 1.15) continue;

      let hit = false;
      if (t === 0)      hit = pTop > def.yMin;       // перекат
      else if (t === 1) hit = pBottom < def.yMax;    // прыжок
      else              hit = true;                  // обход

      if (hit) { o.active = false; onHit(); return; }
    }
  }

  /* ═══ МОНЕТЫ ═══ */
  const magnetOn = magnetTimer > 0;
  for (let i = 0; i < COIN_MAX; i++) {
    const c = coinsArr[i];
    if (!c.active) continue;

    c.z += move;
    c.rot += dt * 5.5;

    if (c.z > DESPAWN_Z) { c.active = false; continue; }

    if (magnetOn) {
      const dx = player.x - c.x;
      const dy = pCenterY - c.y;
      const dz = -c.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < 110) {
        const inv = 1 / Math.sqrt(d2 + 0.0001);
        const pull = 62 * dt;
        c.x += dx * inv * pull;
        c.y += dy * inv * pull;
        c.z += dz * inv * pull;
      }
    }

    if (c.z > -1.25 && c.z < 1.25 &&
        Math.abs(c.x - player.x) < 1.05 &&
        Math.abs(c.y - pCenterY) < 1.15) {
      c.active = false;
      coins++;
      score += COIN_SCORE * (x2Timer > 0 ? 2 : 1);
    }
  }

  /* ═══ БОНУСЫ ═══ */
  for (let i = 0; i < PU_MAX; i++) {
    const u = puArr[i];
    if (!u.active) continue;

    u.z += move;
    u.rot += dt * 3;
    u.y = 1.1 + Math.sin(u.rot * 2) * 0.15;

    if (u.z > DESPAWN_Z) { u.active = false; continue; }

    if (u.z > -1.4 && u.z < 1.4 &&
        Math.abs(u.x - player.x) < 1.2 &&
        Math.abs(u.y - pCenterY) < 1.5) {
      u.active = false;
      if (u.kind === 0) magnetTimer = MAGNET_TIME;
      else              x2Timer = X2_TIME;
    }
  }

  /* ═══ СПАВН ПАТТЕРНОВ ═══ */
  spawnAccum += move;
  if (spawnAccum >= nextGap) {
    spawnAccum = 0;
    const len = spawnPattern(SPAWN_Z);
    /* ПЛОТНОСТЬ: было len + 26 + speed*0.35 → стало len + 8 + speed*0.1 */
    nextGap = len + 8 + speed * 0.1;
  }

  /* ═══ ВИЗУАЛ ИГРОКА ═══ */
  const sx = 1 + (1 - player.h / STAND_H) * 0.45;
  playerGroup.position.set(player.x, player.y + player.h * 0.5, 0);
  playerGroup.scale.set(sx, player.h, sx);

  boardMesh.visible = boardActive;
  if (boardActive) {
    boardMesh.position.set(player.x, player.y + 0.07, 0);
    boardMesh.rotation.y = performance.now() * 0.002;
  }

  updateHUD(dt);
}

/* ═══════════════════════════════════════════════════════════════
   РЕНДЕР ИНСТАНСОВ
   ═══════════════════════════════════════════════════════════════ */
const _m4 = new THREE.Matrix4();

function renderInstances() {
  /* монеты */
  let n = 0;
  for (let i = 0; i < COIN_MAX; i++) {
    const c = coinsArr[i];
    if (!c.active) continue;
    _m4.makeRotationY(c.rot);
    _m4.setPosition(c.x, c.y, c.z);
    coinMesh.setMatrixAt(n++, _m4);
  }
  coinMesh.count = n;
  if (n) coinMesh.instanceMatrix.needsUpdate = true;

  /* препятствия */
  for (let t = 0; t < 3; t++) {
    const def  = OB_DEF[t];
    const pool = obPools[t];
    const mesh = obMeshes[t];
    let k = 0;
    for (let i = 0; i < OB_PER_TYPE; i++) {
      const o = pool[i];
      if (!o.active) continue;
      _m4.makeScale(def.w, def.h, def.d);
      _m4.setPosition(o.x, def.cy, o.z);
      mesh.setMatrixAt(k++, _m4);
    }
    mesh.count = k;
    if (k) mesh.instanceMatrix.needsUpdate = true;
  }

  /* бонусы */
  let p = 0;
  for (let i = 0; i < PU_MAX; i++) {
    const u = puArr[i];
    if (!u.active) continue;
    _m4.makeRotationY(u.rot);
    _m4.setPosition(u.x, u.y, u.z);
    puMesh.setMatrixAt(p, _m4);
    puMesh.setColorAt(p, u.color);
    p++;
  }
  puMesh.count = p;
  if (p) {
    puMesh.instanceMatrix.needsUpdate = true;
    puMesh.instanceColor.needsUpdate = true;
  }
}

/* ═══════════════════════════════════════════════════════════════
   ГЛАВНЫЙ ЦИКЛ
   ═══════════════════════════════════════════════════════════════ */
let lastTime = performance.now();
const MAX_DT = 1 / 30;          // защита от туннелирования и лагов

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > MAX_DT) dt = MAX_DT;
  if (dt < 0) dt = 0;

  if (gameState === 'play') {
    update(dt);
  } else {
    /* медленная прокрутка земли в меню */
    groundMat.uniforms.uScroll.value += dt * 9;
    boardMesh.visible = false;
    playerGroup.position.set(player.x, player.y + player.h * 0.5, 0);
  }

  renderInstances();
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════
   RESIZE
   ═══════════════════════════════════════════════════════════════ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight);
});

requestAnimationFrame(loop);
</script>
